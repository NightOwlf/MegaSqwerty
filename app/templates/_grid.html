{# One table, drawn like a TunerStudio table editor: title bar, toolbar,
   the grid itself, then the colour scale and a live cell readout. #}
<figure class="hm-wrap" data-grid="{{ g.id }}"{% if g.fuel %} data-fuel="{{ g.fuel }}"{% endif %}>
  <div class="hm-bar">
    <span class="hm-title">{{ g.title }}</span>
    {% if g.name and g.name != g.title %}<code class="hm-name">{{ g.name }}</code>{% endif %}
    <span class="hm-dims mono">{{ g.dims }}</span>
    <button class="icon-btn hm-fold" type="button" data-fold aria-expanded="true" title="Collapse"><span aria-hidden="true">▾</span><span class="sr">Collapse table</span></button>
  </div>

  <div class="hm-body">
    {% if g.fuel %}
    <div class="hm-tools fuelbar">
      <div class="seg" role="group" aria-label="Display as">
        <button type="button" data-fuel-show="lambda" aria-pressed="{{ 'true' if g.fuel == 'lambda' else 'false' }}">λ Lambda</button>
        <button type="button" data-fuel-show="afr" aria-pressed="{{ 'true' if g.fuel == 'afr' else 'false' }}">AFR</button>
      </div>
      <label class="stoich">Stoich
        <select data-stoich>
          <option value="14.7">Gasoline 14.7</option>
          <option value="9.76">E85 9.76</option>
          <option value="14.1">E10 14.1</option>
          <option value="9.0">Ethanol 9.0</option>
          <option value="6.47">Methanol 6.47</option>
          <option value="custom">Custom…</option>
        </select>
        <input type="number" inputmode="decimal" step="0.01" min="3" max="25" data-stoich-custom placeholder="14.7" hidden>
      </label>
      <p class="showing">Showing <b data-showing>{{ 'lambda (λ), as stored in the tune' if g.fuel == 'lambda' else 'AFR, as stored in the tune' }}</b></p>
    </div>
    {% endif %}

    {% if g.note %}<p class="note">{{ g.note }}</p>{% endif %}
    {% for n in notes or [] %}<p class="note">{{ n }}</p>{% endfor %}

    <div class="hm-scroll">
      <table class="hm{{ ' diff' if g.is_diff }}" data-xl="{{ g.x_label }}" data-yl="{{ g.y_label }}" data-units="{{ g.units }}">
        <thead><tr><th class="ax corner" scope="col"><span class="cy">{{ g.y_label or 'Y' }}</span><span class="cx">{{ g.x_label or 'X' }}</span></th>{% for x in g.x_labels %}<th class="ax x" scope="col">{{ x }}</th>{% endfor %}<th class="ax end"></th></tr></thead>
        <tbody>
        {% for row in g.rows %}<tr><th class="ax y" scope="row">{{ row.label }}</th>{% for c in row.cells %}<td{% if c.style %} style="{{ c.style }}"{% endif %}{% if c.cls %} class="{{ c.cls }}"{% endif %}{% if g.is_diff %} data-a="{{ c.a_text }}"{% endif %}>{{ c.text }}{% if c.delta %}<small>{{ c.delta }}</small>{% endif %}</td>{% endfor %}<th class="ax end">{{ row.label }}</th></tr>
        {% endfor %}
        </tbody>
        <tfoot><tr><th class="ax corner"></th>{% for x in g.x_labels %}<th class="ax x">{{ x }}</th>{% endfor %}<th class="ax end"></th></tr></tfoot>
      </table>
    </div>

    <div class="hm-foot">
      {% if g.is_diff %}
      <div class="legend">
        <span class="sw down"></span><span>lower in B</span>
        <span class="sw up"></span><span>higher in B</span>
        <span class="sw same"></span><span>unchanged</span>
        <span class="mono dim">max Δ {{ g.hi }}</span>
      </div>
      {% else %}
      <div class="legend">
        <span class="mono" data-lo>{{ g.lo }}</span>
        <i class="ramp" style="background:{{ g.gradient }}"></i>
        <span class="mono" data-hi>{{ g.hi }}</span>
        <span class="dim">{{ g.legend[0] }} → {{ g.legend[1] }}</span>
      </div>
      <dl class="tstats mono">
        <div><dt>min</dt><dd data-lo>{{ g.lo }}</dd></div>
        <div><dt>max</dt><dd data-hi>{{ g.hi }}</dd></div>
        <div><dt>avg</dt><dd data-avg>{{ g.avg }}</dd></div>
        <div><dt>cells</dt><dd>{{ g.cell_count }}</dd></div>
        {% if g.units %}<div><dt>units</dt><dd data-units-label>{{ g.units }}</dd></div>{% endif %}
      </dl>
      {% endif %}
      <output class="hm-readout mono" data-readout>Tap a cell to read it</output>
    </div>
  </div>
</figure>
