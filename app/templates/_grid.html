{% from "_macros.html" import icon %}
{% set can_edit = g.editable and not g.is_diff %}
<figure class="hm-wrap" data-grid="{{ g.id }}"{% if g.fuel %} data-fuel="{{ g.fuel }}"{% endif %}{% if can_edit %} data-edit-name="{{ g.name }}" data-digits="{{ g.edit_digits }}" data-stops="{{ g.stops }}" data-lo-v="{{ g.lo_v }}" data-hi-v="{{ g.hi_v }}"{% endif %}>
  <div class="ed-bar">
    {% if not hide_title %}
    <div class="hm-titles">
      <h3 class="hm-title">{% if detail_url %}<a href="{{ detail_url }}">{{ g.title }}</a>{% else %}{{ g.title }}{% endif %}</h3>
      <p class="hm-sub mono">{% if g.name and g.name != g.title %}{{ g.name }} · {% endif %}{{ g.dims }}{% if g.units %} · <span data-units-label>{{ g.units }}</span>{% endif %}</p>
    </div>
    {% endif %}
    <div class="hm-tools" role="toolbar" aria-label="Table view">
      <button type="button" class="tool" data-hm-3d aria-pressed="false" title="3D view of the table">{{ icon('cube') }}<span>3D</span></button>
      <button type="button" class="tool" data-hm-fit aria-pressed="false" title="Fit the whole table to the screen width">{{ icon('fit') }}<span>Fit</span></button>
      <button type="button" class="tool" data-hm-vals aria-pressed="true" title="Show numbers in cells">{{ icon('eye') }}<span>Values</span></button>
      <button type="button" class="tool" data-hm-copy title="Copy as spreadsheet (TSV)">{{ icon('copy') }}<span>Copy</span></button>
      {% if detail_url %}<a class="tool" href="{{ detail_url }}" title="Open in its own window">{{ icon('expand') }}<span>Open</span></a>{% endif %}
    </div>
  </div>
  {% if can_edit %}
  <div class="edtools" role="toolbar" aria-label="Edit cells">
    <span class="edsel" data-edsel>Select cells: click or drag, shift-click to extend. On a phone, tap a cell, or Range then tap the far corner.</span>
    <input class="edval" type="text" inputmode="decimal" enterkeyhint="done" data-edval placeholder="Value" aria-label="Value" autocomplete="off">
    <button type="button" class="tool" data-op="set" title="Set selected cells to the value (Enter)">= Set</button>
    <button type="button" class="tool" data-op="add" title="Add the value to selected cells (Shift+Enter)">+ Add</button>
    <button type="button" class="tool" data-op="scale" title="Change selected cells by the value, in percent">± %</button>
    <button type="button" class="tool" data-op="up" title="Increase by one step (+)">▲</button>
    <button type="button" class="tool" data-op="down" title="Decrease by one step (−)">▼</button>
    <button type="button" class="tool" data-op="interp" title="Interpolate between the corners of the selection">Interpolate</button>
    <button type="button" class="tool" data-op="range" aria-pressed="false" title="Tap a second cell to select everything between">Range</button>
    <button type="button" class="tool" data-op="undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
  </div>
  {% endif %}
  {% if g.fuel %}
  <div class="fuelbar">
    <div class="seg" role="group" aria-label="Display as">
      <button type="button" data-fuel-show="lambda" aria-pressed="{{ 'true' if g.fuel == 'lambda' else 'false' }}">λ Lambda</button>
      <button type="button" data-fuel-show="afr" aria-pressed="{{ 'true' if g.fuel == 'afr' else 'false' }}">AFR</button>
    </div>
    <label class="stoich"><span>Stoich</span>
      <select data-stoich>
        <option value="14.7">Gasoline 14.7</option>
        <option value="9.76">E85 9.76</option>
        <option value="14.1">E10 14.1</option>
        <option value="9.0">Ethanol 9.0</option>
        <option value="6.47">Methanol 6.47</option>
        <option value="custom">Custom…</option>
      </select>
      <input type="number" inputmode="decimal" step="0.01" min="3" max="25" data-stoich-custom placeholder="14.7" hidden>
    </label>
    <p class="showing">Showing <b data-showing>{{ 'Lambda (λ), as stored in the tune' if g.fuel == 'lambda' else 'AFR, as stored in the tune' }}</b></p>
  </div>
  {% endif %}
  <div class="legend">
    {% if g.is_diff %}
    <span class="lg"><i class="sw down"></i>lower in B</span><span class="lg"><i class="sw up"></i>higher in B</span><span class="lg"><i class="sw same"></i>same</span>
    {% if g.hi and g.hi != '0' %}<span class="mono dim">max Δ {{ g.hi }}</span>{% endif %}
    {% else %}
    <span class="mono" data-lo>{{ g.lo }}</span><i class="ramp" style="background:{{ g.gradient }}"></i><span class="mono" data-hi>{{ g.hi }}</span>
    <span class="dim">{{ g.legend[0] }} → {{ g.legend[1] }}</span>
    {% endif %}
  </div>
  {% if g.load %}<p class="loadsrc" title="What this table's load axis measures, from the tune's own setting">{{ icon('info') }}<span>{% if g.load.known %}Load is <b>{{ g.load.measure }}{% if g.load.units %} ({{ g.load.units }}){% endif %}</b>{% else %}Load is set by{% endif %} · <span class="mono">{{ g.load.setting }}</span> = “{{ g.load.choice }}”</span></p>{% endif %}
  {% if g.note %}<p class="hint">{{ g.note }}</p>{% endif %}
  {% if g.axes_note %}<p class="hint">{{ g.axes_note }}</p>{% endif %}
  {% for n in notes or [] %}<p class="hint">{{ n }}</p>{% endfor %}
  <div class="ed-main">
    <div class="hm-scroll">
      <table class="hm{{ ' diff' if g.is_diff }}" data-xl="{{ g.x_label }}" data-yl="{{ g.y_label }}" data-xu="{{ g.x_units }}" data-yu="{{ g.y_units }}" data-units="{{ g.units }}">
        <tbody>
        {% for row in g.rows %}<tr><th class="ax y" scope="row">{{ row.label }}</th>{% for c in row.cells %}<td{% if c.style %} style="{{ c.style }}"{% endif %}{% if c.cls %} class="{{ c.cls }}"{% endif %}{% if g.is_diff %} data-a="{{ c.a_text }}"{% endif %}{% if can_edit %} data-i="{{ row.index * g.x_labels|length + c.c }}"{% endif %}>{{ c.text }}{% if c.delta %}<small>{{ c.delta }}</small>{% endif %}</td>{% endfor %}</tr>
        {% endfor %}
        </tbody>
        <tfoot><tr><th class="ax corner" scope="col"><span>{{ g.y_text }} ↑</span><span>{{ g.x_text }} →</span></th>{% for x in g.x_labels %}<th class="ax x" scope="col">{{ x }}</th>{% endfor %}</tr></tfoot>
      </table>
    </div>
    <div class="ed-3d" hidden>
      <canvas class="plot3d" role="img" aria-label="3D view of {{ g.title }}"></canvas>
      <span class="plot3d-hint">Drag to rotate · double-tap to reset</span>
    </div>
  </div>
</figure>
