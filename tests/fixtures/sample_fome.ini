; Synthetic TunerStudio ini for tests (FOME/rusEFI layout). Not a real firmware ini.
[MegaTune]
	signature	= "rusEFI (FOME) Testboard.2026.01.01.testboard.123456"

[TunerStudio]
	signature = "rusEFI (FOME) Testboard.2026.01.01.testboard.123456" ; signature is expected to be 7 or more characters

[Constants]
	;  name = scalar, type, offset, units, scale, translate, lo, hi, digits
	;  name = array,  type, offset, shape, units, scale, translate, lo, hi, digits
page = 1
cylindersCount = scalar, U08, 0, "", 1, 0, 1, 12, 0
rpmHardLimit = scalar, U16, 2, "rpm", 1, 0, 0, 20000, 0
injector_flow = scalar, F32, 4, "cc/min", 1, 0, 0, 99999, 2
fuelAlgorithm = bits, U08, 8, [0:2], "Speed Density", "MAF Air Charge", "Alpha-N", "Lua"
engineType = bits, S32, 12, [0:6], 0="DEFAULT_FRANKENSO", 1="TEST"
veTable = array, U16, 16, [16x16], "%", 0.1, 0, 0, 999, 1
veRpmBins = array, U16, 528, [16], "RPM", 1, 0, 0, 18000, 0
veLoadBins = array, U16, 560, [16], "kPa", 1, 0, 0, 1000, 0
ignitionTable = array, S16, 592, [16x16], "deg", 0.1, 0, -20, 90, 1
ignitionRpmBins = array, U16, 1104, [16], "RPM", 1, 0, 0, 18000, 0
ignitionLoadBins = array, U16, 1136, [16], "Load", 1, 0, 0, 1000, 0
#if LAMBDA
lambdaTable = array, U08, 1168, [16x16], "lambda", 0.0068, 0, 0.6, 1.5, 2
#else
lambdaTable = array, U08, 1168, [16x16], "afr", 0.1, 0, 0, 25, 1
#endif
lambdaRpmBins = array, U16, 1424, [16], "RPM", 1, 0, 0, 18000, 0
lambdaLoadBins = array, U16, 1456, [16], "", 1, 0, 0, 1000, 0
vvtTable1 = array, S08, 1488, [8x8], "deg", 1, 0, -40, 40, 0
vvtTable1RpmBins = array, U16, 1552, [8], "RPM", 1, 0, 0, 18000, 0
vvtTable1LoadBins = array, U16, 1568, [8], "Load", 1, 0, 0, 255, 0
cltFuelCorrBins = array, F32, 1584, [16], "C", 1, 0, -100, 250, 1
cltFuelCorr = array, F32, 1648, [16], "ratio", 1, 0, 0, 5, 2

[TableEditor]
	;		table_id,	map3d_id,	"title",		page
	table = veTableTbl,  veTableMap,  "VE Table",	1
		xyLabels = "RPM", "load"
		xBins		= veRpmBins,  RPMValue
		yBins		= veLoadBins, veTableYAxis
		zBins		= veTable
		upDownLabel = "(RICHER)", "(LEANER)"

	table = ignitionTableTbl,  ignitionTableMap,  "Ignition Table",	1
		xBins		= ignitionRpmBins,  RPMValue
		yBins		= ignitionLoadBins,  ignitionLoad
		zBins		= ignitionTable

#if LAMBDA
	table = lambdaTableTbl,  lambdaTableMap,  "Target Lambda Table",	1
#else
	table = afrTableTbl,  afrTableMap,  "Target AFR Table",	1
#endif
		xBins		= lambdaRpmBins,  RPMValue
		yBins		= lambdaLoadBins, afrTableYAxis
		zBins		= lambdaTable

	table = vvtTable1Tbl,  vvtTable1Map,  "Intake VVT closed loop Target",	1
		xyLabels	= {bitStringValue(pwmAxisLabels, vvtXAxis)}, "Load"
		xBins		= vvtTable1RpmBins,  RPMValue
		yBins		= vvtTable1LoadBins,  VVT_targetYAxis
		zBins		= vvtTable1

[CurveEditor]
	curve = cltFuelCorrCurve, "Warmup fuel manual Multiplier"
		columnLabel = "Coolant", "Multiplier"
		xAxis		=  -40, 120, 9
		yAxis		=  0,  3, 10
		xBins		= cltFuelCorrBins, coolant
		yBins		= cltFuelCorr
		gauge		= CLTGauge
